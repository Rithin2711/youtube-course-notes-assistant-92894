version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./youtube_notes.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - .:/app
      - sqlite_data:/app/youtube_notes.db
    command: python start.py

volumes:
  sqlite_data:
